const ROUTE_SEED=[
 ['hejiac','何家冲','河南 · 罗山','1934.11.16',820,480,'出发','1934年11月16日，红二十五军从河南省罗山县何家冲出发，开始长征。这是这条路线的起点。',['start','army']],
 ['dushu','独树镇','河南 · 方城','1934.11.26',790,356,'西进','长征初期，红二十五军在独树镇附近遭遇阻击。部队经过战斗和突围，继续向西前进。',['army']],
 ['yuji','庾家河','陕西 · 丹凤','1934.12.10',634,330,'入陕','进入陕西后，省委在庾家河召开会议，决定创建鄂豫陕革命根据地。这里也是红二十五军长征中的重要战斗节点。',['base','west']],
 ['base','鄂豫陕根据地','商洛及鄂豫陕边区','1934.12—1935.07',593,397,'根据地','红二十五军在鄂豫陕边开展群众工作和根据地建设，并进行反“围剿”斗争。图中的位置表示这一阶段，不能理解为部队只停留在一个地点。',['base','west']],
 ['fengyu','沣峪口','陕西 · 长安','1935.07.16',487,326,'继续长征','为配合主力红军北上，红二十五军于1935年7月从沣峪口一带出发，再次踏上西征北上的道路。',['base','west']],
 ['liangdang','两当','甘肃 · 两当','1935.08',275,372,'进入甘肃','红二十五军经秦岭山区西进，进入甘肃两当，随后继续向天水方向前进。',['gansu']],
 ['qinan','秦安','甘肃 · 秦安','1935.08',217,259,'北上','红二十五军渡过渭河后，进入秦安一带，开展宣传和群众工作，继续向北行动。',['qinan','meet']],
 ['jingning','静宁','甘肃 · 静宁','1935.08',213,178,'北上','红二十五军经过静宁一带，牵制敌军，并继续向隆德和六盘山方向前进。',['gansu','meet']],
 ['liupan','隆德·六盘山','宁夏 · 隆德、六盘山','1935.08.17前后',282,140,'东进','红二十五军攻占隆德后翻越六盘山，向东前进。这里是进入陕甘苏区之前的重要路段。',['army','gansu']],
 ['sipo','泾川·四坡村','甘肃 · 泾川','1935.08.21',375,214,'东进','红二十五军在泾川四坡村与敌军交战。军政治委员吴焕先在战斗中牺牲。部队继续向陕甘苏区前进。',['army','gansu']],
 ['huating','华亭·安口窑','甘肃 · 华亭','1935.08.30前后',337,277,'转战','红二十五军经华亭、安口窑一带转战，随后北进，朝陕甘苏区前行。',['gansu','meet']],
 ['yongning','永宁山','陕西 · 志丹','1935.09.09',477,154,'进入苏区','红二十五军抵达永宁山一带，与陕甘根据地党组织取得联系，为会师作准备。',['gansu','meet']],
 ['yongping','永坪','陕西 · 延川','1935.09.15—16',589,91,'会师','1935年9月15日，红二十五军到达永坪，次日与红二十六军、红二十七军会师，结束长征。随后三支部队合编为红十五军团。',['start','army','meet']]
];

const GEO_VIEW=GEO_DATA.view;
const geoRadians=Math.PI/180;
function mercatorY(lat){return Math.log(Math.tan(Math.PI/4+lat*geoRadians/2));}
const geoWest=GEO_VIEW.bounds[0]*geoRadians,geoEast=GEO_VIEW.bounds[2]*geoRadians,geoSouth=mercatorY(GEO_VIEW.bounds[1]),geoNorth=mercatorY(GEO_VIEW.bounds[3]);
const geoScale=Math.min((GEO_VIEW.width-2*GEO_VIEW.padding)/(geoEast-geoWest),(GEO_VIEW.height-2*GEO_VIEW.padding)/(geoNorth-geoSouth));
function projectGeo(coord){return {x:GEO_VIEW.width/2+(coord[0]*geoRadians-(geoWest+geoEast)/2)*geoScale,y:GEO_VIEW.height/2+((geoNorth+geoSouth)/2-mercatorY(coord[1]))*geoScale};}
function mapLocations(nodes){return nodes.filter(n=>GEO_DATA.places[n.id]).map(n=>({...n,...projectGeo(GEO_DATA.places[n.id].coord)}));}

const esc=escapeHtml;
function clone(value){return structuredClone(value);}
function normalizeGroup(s){return s.trim().normalize('NFKC').toLocaleLowerCase();}
function validateState(s){
 if(!s||s.schemaVersion!==1||!s.settings||!Array.isArray(s.nodes)||s.nodes.length<2)throw new Error('数据格式不正确。');
 const ids=new Set(),groups=new Set();
 for(const n of s.nodes){if(!n.id||ids.has(n.id))throw new Error('节点编号不能重复。');ids.add(n.id);if(!n.name.trim()||!n.history.trim())throw new Error('节点名称和历史背景不能为空。');if(n.group?.trim()){if(!n.teaching)throw new Error('请先将该节点设为教学节点，再关联小组。');const k=normalizeGroup(n.group);if(groups.has(k))throw new Error('这个小组已经关联其他节点。每个小组只能对应一个节点。');groups.add(k);}if(n.published&&(!n.teaching||n.group!==n.published.group))throw new Error('已有发布内容的节点，改变小组关联时请直接更新发布，或先撤回发布。');}
 return true;

function mapHtml(){
 const locations=mapLocations(state.nodes),pts=locations.map(n=>`${n.x.toFixed(2)},${n.y.toFixed(2)}`).join(' '),w=GEO_VIEW.width,h=GEO_VIEW.height;
 const path=ring=>ring.map((c,i)=>{const p=projectGeo(c);return `${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`;}).join(' ')+'Z';
 const provinces=GEO_DATA.provinces.map(p=>`<path class="map-province ${[410000,610000,620000,640000].includes(p.code)?'route-region':''}" d="${p.rings.map(path).join(' ')}" fill-rule="evenodd"><title>${esc(p.name)}</title></path>`).join('');
 const grid=[106,108,110,112,114].map(lon=>{const p=projectGeo([lon,34]);return `<path class="geo-grid" d="M${p.x} 12V${h-22}"/><text class="geo-grid-label" x="${p.x}" y="${h-13}" text-anchor="middle">${lon}°E</text>`;}).join('')+[32,34,36].map(lat=>{const p=projectGeo([110,lat]);return `<path class="geo-grid" d="M14 ${p.y}H${w-14}"/><text class="geo-grid-label" x="21" y="${p.y-6}">${lat}°N</text>`;}).join('');
 const labels=GEO_DATA.labels.map(([name,lon,lat])=>{const p=projectGeo([lon,lat]);return `<text class="geo-region-label" x="${p.x}" y="${p.y}" text-anchor="middle">${name}</text>`;}).join('');
 const markers=locations.map(n=>{const i=state.nodes.indexOf(n),g=GEO_DATA.places[n.id],[dx,dy]=g.offset,anchor=dx<0?'end':dx===0?'middle':'start',lx=n.x+dx,ly=n.y+dy;
  return `<g class="pin ${n.id===selectedId?'active':''}" data-select="${esc(n.id)}" tabindex="0" role="button" aria-label="${i+1} ${esc(n.name)}，${esc(n.date)}" aria-pressed="${n.id===selectedId}"><title>${esc(n.name)}${g.approx?' · '+esc(g.approx):''}</title>${n.id==='base'?`<circle class="geo-stage-ring" cx="${n.x}" cy="${n.y}" r="23"/>`:''}${Math.abs(dy)>25||Math.abs(dx)>23?`<path class="geo-leader" d="M${n.x} ${n.y}L${lx} ${ly-(dy>0?8:-5)}"/>`:''}<circle class="outer" cx="${n.x}" cy="${n.y}" r="13"/><circle class="inner" cx="${n.x}" cy="${n.y}" r="8"/><text class="number" x="${n.x}" y="${n.y}">${i+1}</text><text class="label" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(n.name)}</text>${n.id==='base'?`<text class="geo-stage-caption" x="${lx}" y="${ly+16}" text-anchor="${anchor}">区域阶段示意</text>`:''}${n.teaching?`<circle class="badge" cx="${n.x+10}" cy="${n.y-9}" r="4.5"/>`:''}</g>`;
 }).join('');
 const kmWidth=geoScale*geoRadians*100/(111.32*Math.cos(34.5*geoRadians));
 return `<svg class="map-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="按经纬度投影的红二十五军长征主要节点地图，可选择节点查看"><defs><clipPath id="geoClip"><rect x="14" y="12" width="${w-28}" height="${h-34}" rx="9"/></clipPath><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#923b35" stroke-width="1.1"/></marker></defs><g clip-path="url(#geoClip)"><rect width="${w}" height="${h}" fill="#eeeddf"/>${provinces}${grid}${labels}<polyline class="route-under" points="${pts}"/><polyline class="route" points="${pts}" marker-mid="url(#arrow)"/>${markers}<g class="geo-scale" transform="translate(48 ${h-48})"><text x="0" y="-10">约100 km</text><path d="M0 -5V0H${kmWidth.toFixed(1)}V-5"/></g></g></svg>`;
}

function galleryHtml(limit=false){const works=state.nodes.filter(n=>n.published).slice(0,limit?3:Infinity);if(!works.length)return `<div class="empty"><div class="empty-icon" aria-hidden="true">▧</div><div><strong>这条路，等待孩子们的第一份创作</strong><p>老师上传并发布后，节点文字、作品照片与视频会出现在这里。</p></div></div>`;return `<div class="gallery-grid">${works.map(n=>`<button class="work-card" data-open="${esc(n.id)}"><div class="work-cover">${n.published.images[0]?`<img src="${esc(n.published.images[0].data)}" alt="${esc(n.published.title)}" loading="lazy">`:n.published.videos.length?'▶ 节点视频':'节点文字记录'}</div><div class="work-info"><span class="tag">${esc(n.published.group)} · ${esc(n.name)}</span><h3>${esc(n.published.title)}</h3><p>${esc(n.published.text||'点击查看本组节点内容')}</p></div></button>`).join('')}</div>`;}
function selectNode(id){if(busy){toast('正在处理，请稍候');return;}if(!state.nodes.some(n=>n.id===id))return;if(view==='admin'&&!allowLeave())return;const mapScroll=$('.map-stage')?.scrollLeft||0,stripScroll=$('.route-strip')?.scrollLeft||0;selectedId=id;dirty=false;render();if($('.map-stage'))$('.map-stage').scrollLeft=mapScroll;if($('.route-strip'))$('.route-strip').scrollLeft=stripScroll;}

 $('#detailContent').innerHTML=`<div class="modal-head"><div><div class="indexlabel">节点 ${String(i+1).padStart(2,'0')} · ${esc(n.date)}</div><h2 id="detailTitle">${esc(n.name)}</h2><p>${esc(n.location)}</p></div><button class="icon-btn" data-close="detailDialog" aria-label="关闭节点详情">×</button></div><div class="modal-body"><section class="detail-section"><h3><span class="tag red">历史背景</span> 这一路发生的故事</h3><div class="prose history-prose">${esc(n.history)}</div><div class="source-line">资料来源：${sourceLinks(n)||'由教学团队核准'}</div></section><section class="detail-section"><h3><span class="tag">小组节点内容</span> ${p?esc(p.group):n.teaching?'等待孩子们的创作':'教学安排待确定'}</h3>${p?`<h4>${esc(p.title)}</h4>${p.activity?`<div class="caption">活动形式：${esc(p.activity)}</div>`:''}<div class="prose">${esc(p.text)}</div>`:`<div class="media-empty">${n.teaching?'本节点内容尚未发布。孩子们完成后，由老师统一整理上传。':'本节点是否安排课堂活动、对应小组与游戏方式，待教学团队确定。'}</div>`}</section><section class="detail-section"><h3>节点图片 <span class="caption">${p?.images.length||0} 张</span></h3>${p?.images.length?`<div class="gallery-media">${p.images.map((m,k)=>`<div><button class="photo-btn" data-photo="${esc(n.id)}:${k}" aria-label="放大图片 ${k+1}"><img src="${esc(m.data)}" alt="${esc(m.name)}" loading="lazy"></button><p class="caption">${esc(m.name)}</p></div>`).join('')}</div>`:'<div class="media-empty">老师上传节点图片后，这里可查看完整照片。</div>'}</section><section class="detail-section"><h3>节点视频 <span class="caption">${p?.videos.length||0} 段</span></h3>${p?.videos.length?`<div class="videos">${p.videos.map(m=>`<div><video src="${esc(m.data)}" controls preload="metadata" playsinline aria-label="${esc(m.name)}"></video><p class="caption">${esc(m.name)}</p></div>`).join('')}</div>`:'<div class="media-empty">老师上传节点视频后，这里可播放活动记录与讲解。</div>'}</section><div class="detail-nav"><button class="btn secondary small" data-next="${i-1}" ${i===0?'disabled':''}>← 上一节点</button><button class="btn secondary small" data-next="${i+1}" ${i===state.nodes.length-1?'disabled':''}>下一节点 →</button></div></div>`;showDialog('detailDialog');if(view==='route')render();}
function renderAbout(){
 $('#main').innerHTML=`<article class="about"><div class="eyebrow">关于这次共同创作</div><h2>把课堂的创作，留在历史的路线上。</h2><p>孩子们以红二十五军长征中的节点为背景，在助教老师带领下完成小组内容。活动形式可以是记录、讲述、模型、表达或其他节点游戏，具体形式由后续课程设计确定。每组负责一个教学节点，各组内容沿同一条路线汇集，学生与家长可在课后重新打开查看。</p><table><tr><th>参加人数</th><td>${state.settings.participants}人，分组数量待教学节点确定</td></tr><tr><th>课程时间</th><td>3小时，制作环节最长，每组一名助教老师带领</td></tr><tr><th>内容上传</th><td>由老师统一整理、上传和发布，学生无需个人账号</td></tr><tr><th>浏览内容</th><td>历史背景、小组文字、节点图片和视频</td></tr></table><h3>路线与课堂节点</h3><p>当前展示${state.nodes.length}个主要历史节点，省界与地点统一使用经纬度投影，横向与纵向保持相同比例。地点按所在县镇近似定位，连接线用于表示先后关系，不代表具体道路或全部途经地点。“鄂豫陕根据地”是区域与阶段概括，以商洛作示意锚点。教学节点、小组数量及游戏形式可以另行配置。</p><p>历史背景与学生创作分开显示。小组内容是课堂作品，不能作为历史事实。这里采用红二十五军路线，不把中央红军的泸定桥、若尔盖草地等经历混入此路线。</p><div class="sources"><h3 style="margin-top:0">地理底图与定位</h3><p class="caption">省界：DataV.GeoAtlas（数据来源为高德开放平台，2021年5月版），仅用于课程学习交流。采用统一墨卡托投影；地名标注通过引线错开，节点坐标不因文字排版而移动。庾家河暂按庾岭镇范围定位；泾川·四坡村暂按泾川县定位；华亭·安口窑暂按华亭市定位；永宁山按永宁镇附近定位。新添加但未核准地理位置的课堂节点，可在下方节点栏与作品页查看。</p><a href="https://datav.aliyun.com/portal/school/atlas/atlas_aigc" target="_blank" rel="noopener noreferrer">DataV.GeoAtlas · 省界数据 ↗</a><a href="https://www.amap.com/place/B017802FLQ" target="_blank" rel="noopener noreferrer">高德地图 · 地点位置参考 ↗</a><a href="https://www.openstreetmap.org/node/3480558966" target="_blank" rel="noopener noreferrer">© OpenStreetMap 贡献者 · 永宁镇位置参考（ODbL）↗</a><h3>路线资料来源</h3>${Object.values(SOURCES).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`).join('')}<p class="caption">原型资料核对日期：2026年10月11日。正式课程内容由教学团队审定。</p></div></article>`;
}
function renderAdmin(){const s=stats(state),n=node();formDraft=clone(n.draft);dirty=false;
 $('#main').innerHTML=`<div class="admin-head"><div><h1>老师的内容工作台</h1><p>${state.settings.participants}位学生 · ${s.teaching}个教学节点 · ${s.groups}个已关联小组 · ${s.published}份已发布内容</p></div><div class="admin-actions"><button class="btn secondary small" id="settingsBtn">课程设置</button><button class="btn ghost small" id="exportBtn">导出只读观看版 ↗</button></div></div><div class="notice">管理演示：尚未接入真实管理员登录。上传与发布仅保存在本机浏览器，不会自动同步给其他访客。可导出只读观看版，或由管理员把导出的观看版更新到GitHub仓库后共享。</div><div class="admin-layout"><aside class="admin-side"><div class="side-top"><h2>路线节点 · ${state.nodes.length}</h2><button id="addNodeBtn">＋ 添加节点</button></div><div class="node-list">${state.nodes.map((x,i)=>`<button class="node-row ${x.id===n.id?'active':''}" data-select="${esc(x.id)}"><span class="order">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(x.name)}</strong><small>${x.teaching?(esc(x.group)||'小组待关联'):'历史节点'}</small></span><i class="dot-status ${x.published?'live':''}" aria-label="${x.published?'已发布':'未发布'}"></i></button>`).join('')}</div></aside><section class="editor" id="editor">${editorHtml(n)}</section></div>`;
 bindEditor(n);
 $('#settingsBtn').onclick=renderSettings;$('#exportBtn').onclick=exportViewer;$('#addNodeBtn').onclick=()=>{if(busy||!allowLeave())return;$('#insertAfter').innerHTML=state.nodes.map(n=>`<option value="${esc(n.id)}" ${n.id===selectedId?'selected':''}>${esc(n.name)}</option>`).join('');showDialog('addDialog');};
}
function editorHtml(n){return `<div class="editor-head"><div><h2>${esc(n.name)}</h2><p>${esc(n.location)} · ${esc(n.date)}</p></div><div class="status-wrap"><span class="tag ${n.published?'green':''}">${n.published?'已有发布版本':'尚未发布'}</span></div></div><form id="contentForm"><label class="checkfield"><input id="teachingInput" type="checkbox" ${n.teaching?'checked':''}>将这里设为教学节点</label><div class="field-row"><label class="field"><span>小组名称</span><input id="groupInput" maxlength="40" value="${esc(n.group)}" placeholder="分组确定后填写，如第1组"><small>一组对应一个节点，不预设分组数量。</small></label><label class="field"><span>活动形式（选填）</span><input id="activityInput" maxlength="80" value="${esc(n.draft.activity)}" placeholder="节点游戏形式确定后填写"></label></div><label class="field"><span>小组内容标题</span><input id="titleInput" maxlength="80" value="${esc(n.draft.title)}" placeholder="为这份节点内容起一个标题"></label><label class="field"><span>节点文字</span><textarea id="textInput" maxlength="3000" placeholder="写下小组的创作、故事或活动记录，不限定为解决方案">${esc(n.draft.text)}</textarea><small>最多3000字；历史背景与小组文字分别展示。</small></label><h3>节点图片</h3><div class="upload-box"><label for="imagesInput">＋ 选择作品照片或节点图片</label><input id="imagesInput" type="file" accept="image/jpeg,image/png,image/webp" multiple><p>JPG / PNG / WebP，每张不超过10MB，最多6张</p></div><div id="imageList" class="admin-media"></div><h3>节点视频</h3><div class="upload-box"><label for="videosInput">＋ 选择活动视频</label><input id="videosInput" type="file" accept="video/mp4,video/webm" multiple><p>MP4 / WebM，每段不超过50MB，最多2段；建议上传短视频</p></div><div id="videoList" class="admin-media"></div><div class="editor-foot"><button class="btn secondary" id="saveBtn" type="submit">保存草稿</button><button class="btn" id="publishBtn" type="button">${n.published?'更新发布内容':'发布节点内容'}</button>${n.published?'<button class="btn danger small" id="withdrawBtn" type="button">撤回发布</button>':''}<span class="stamp" id="saveStamp">${fmtTime(n.updatedAt)}</span></div><p class="caption">保存草稿不会改变用户已看到的版本。点击发布后，用户页面才展示这份内容。</p></form>${n.isCustom?'<div style="margin-top:20px"><button class="btn danger small" id="deleteNodeBtn">删除这个自定义节点</button></div>':''}`;}
function bindEditor(n){
 $('#contentForm').addEventListener('input',()=>dirty=true);$('#contentForm').onsubmit=e=>{e.preventDefault();saveContent(false);};
 $('#publishBtn').onclick=()=>saveContent(true);
 $('#imagesInput').onchange=e=>addFiles(e.target,'images');$('#videosInput').onchange=e=>addFiles(e.target,'videos');
 $('#withdrawBtn')?.addEventListener('click',async()=>{if(busy||!confirm('撤回后，用户将暂时看不到本节点的小组内容。继续吗？'))return;await runMutation(async()=>{await commit(s=>{s.nodes.find(x=>x.id===n.id).published=null;});toast('已撤回，草稿仍保留');renderAdmin();});});
 $('#deleteNodeBtn')?.addEventListener('click',async()=>{if(busy||!confirm('确认删除这个自定义节点及其内容？'))return;await runMutation(async()=>{await commit(s=>{s.nodes=s.nodes.filter(x=>x.id!==n.id);});selectedId=state.nodes[0].id;toast('节点已删除');renderAdmin();});});
 renderAdminMedia();
}
function collectForm(n){n.teaching=$('#teachingInput').checked;n.group=$('#groupInput').value.trim();n.draft={...clone(formDraft),title:$('#titleInput').value.trim(),text:$('#textInput').value.trim(),activity:$('#activityInput').value.trim()};n.updatedAt=new Date().toISOString();}
async function runMutation(fn){busy=true;const buttons=$$('#editor button,#exportBtn');buttons.forEach(b=>b.disabled=true);try{await fn();}catch(e){toast(e.name==='QuotaExceededError'?'浏览器保存空间不足。请减少视频大小后重新保存。':e.message||'操作失败，请重试。',true);}finally{busy=false;buttons.filter(b=>b.isConnected).forEach(b=>b.disabled=false);}}
async function saveContent(publish){if(busy)return;await runMutation(async()=>{await commit(s=>{const n=s.nodes.find(x=>x.id===selectedId);collectForm(n);if(publish)publishNode(n);});dirty=false;toast(publish?'节点内容已发布，可在用户页面查看':'草稿已保存');renderAdmin();});}
function renderAdminMedia(){for(const kind of ['images','videos']){const el=$(kind==='images'?'#imageList':'#videoList');if(!el)return;el.innerHTML=formDraft[kind].map((m,i)=>`<div class="admin-asset">${kind==='images'?`<img src="${esc(m.data)}" alt="${esc(m.name)}">`:`<video src="${esc(m.data)}" controls preload="metadata" playsinline></video>`}<small>${esc(m.name)}</small><button type="button" data-remove="${kind}:${i}">移除</button></div>`).join('');}}
async function readFile(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve({name:file.name,mime:file.type,data:fr.result});fr.onerror=()=>reject(new Error('文件读取失败，请重新选择。'));fr.readAsDataURL(file);});}
async function addFiles(input,kind){if(busy)return;const files=[...input.files],limit=kind==='images'?6:2,max=kind==='images'?10:50,types=kind==='images'?['image/jpeg','image/png','image/webp']:['video/mp4','video/webm'];try{if(files.length+formDraft[kind].length>limit)throw new Error(`最多上传${limit}${kind==='images'?'张图片':'段视频'}。`);for(const f of files){if(!types.includes(f.type))throw new Error('文件格式不支持，请按提示选择。');if(f.size>max*1024*1024)throw new Error(`${f.name}超过${max}MB，请压缩后上传。`);}busy=true;$('#saveBtn').disabled=true;$('#publishBtn').disabled=true;const media=await Promise.all(files.map(readFile));formDraft[kind].push(...media);dirty=true;renderAdminMedia();toast('文件已加入草稿，保存或发布后生效');}catch(e){toast(e.message,true);}finally{busy=false;input.value='';$('#saveBtn').disabled=false;$('#publishBtn').disabled=false;}}
function renderSettings(){if(busy||!allowLeave())return;dirty=false;$('#editor').innerHTML=`<div class="editor-head"><div><h2>课程设置</h2><p>人数与介绍可更新，分组数量由节点关联自动统计。</p></div></div><form id="settingsForm"><label class="field"><span>网站标题</span><input id="siteTitle" maxlength="50" required value="${esc(state.settings.title)}"></label><label class="field"><span>课程介绍</span><textarea id="siteIntro" maxlength="300" required>${esc(state.settings.intro)}</textarea></label><label class="field"><span>参与人数</span><input id="siteParticipants" type="number" min="1" max="10000" required value="${state.settings.participants}"></label><div class="notice">具体教学节点、一个节点对应的小组及活动形式，在左侧逐节点设置。</div><button class="btn" type="submit">保存课程设置</button></form>`;$('#settingsForm').oninput=()=>dirty=true;$('#settingsForm').onsubmit=async e=>{e.preventDefault();if(busy)return;await runMutation(async()=>{const title=$('#siteTitle').value.trim(),intro=$('#siteIntro').value.trim(),participants=Number($('#siteParticipants').value);if(!title||!intro||!Number.isInteger(participants)||participants<1||participants>10000)throw new Error('请填写完整的课程信息。');await commit(s=>{s.settings={title,intro,participants};});dirty=false;toast('课程设置已保存');renderAdmin();});};}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function exportViewer(){if(busy)return;if(dirty&&!confirm('观看版仅导出已发布内容，未保存的内容不包含在内。继续导出吗？'))return;await runMutation(async()=>{const html=document.documentElement.cloneNode(true);html.querySelector('body').dataset.viewerOnly='true';html.querySelector('#embedded-data').textContent=JSON.stringify(publicState(state)).replace(/</g,'\\u003c');html.querySelector('#main').innerHTML='';html.querySelector('#detailContent').innerHTML='';html.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));html.querySelector('#toast').hidden=true;html.querySelector('#toast').textContent='';html.querySelector('#teacherButton').hidden=true;html.querySelector('#lightImage').removeAttribute('src');download('少年长征记_只读观看版.html','<!doctype html>\n'+html.outerHTML,'text/html;charset=utf-8');toast('已导出观看版，可发送给学生与家长离线查看');});}
$('#addForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target);await runMutation(async()=>{const name=String(f.get('name')).trim(),history=String(f.get('history')).trim(),source=String(f.get('source')).trim();if(!name||!history)throw new Error('请填写节点名称和核准背景。');if(source&&!/^https?:\/\//i.test(source))throw new Error('资料来源请使用http或https链接。');const id='custom-'+crypto.randomUUID();await commit(s=>{const i=s.nodes.findIndex(n=>n.id===f.get('after')),a=s.nodes[i],b=s.nodes[i+1]||{x:a.x+40,y:a.y+40};s.nodes.splice(i+1,0,{id,name,history,location:String(f.get('location')).trim(),date:'教学节点 · 日期待核准',x:(a.x+b.x)/2,y:(a.y+b.y)/2,stage:'课堂',sources:source?[{title:'教学团队提供的资料',url:source}]:[],isCustom:true,teaching:true,group:'',draft:emptyDraft(),published:null,updatedAt:null});});selectedId=id;dirty=false;e.target.reset();closeDialog('addDialog');toast('节点已添加，请关联小组并录入内容');renderAdmin();});};
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-select]');if(!b)return;if(b.disabled)return;if(b.dataset.view)switchView(b.dataset.view);if(b.dataset.select)selectNode(b.dataset.select);if(b.dataset.open)openNode(b.dataset.open);if(b.dataset.close)closeDialog(b.dataset.close);if(b.dataset.next!==undefined){const n=state.nodes[Number(b.dataset.next)];if(n)openNode(n.id);}if(b.dataset.photo){const [id,k]=b.dataset.photo.split(':');const m=node(id).published.images[Number(k)];$('#lightImage').src=m.data;$('#lightImage').alt=m.name;showDialog('lightDialog');}if(b.dataset.remove){const [kind,i]=b.dataset.remove.split(':');formDraft[kind].splice(Number(i),1);dirty=true;renderAdminMedia();}if(b.dataset.action==='backroute')switchView('route');});
document.addEventListener('keydown',e=>{const target=e.target.closest('[data-select]');if(target?.tagName.toLowerCase()==='g'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectNode(target.dataset.select);}});
$$('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog(d.id);}});d.addEventListener('close',()=>d.querySelectorAll('video').forEach(v=>v.pause()));});
$('#teacherButton').onclick=()=>{if(!READ_ONLY)switchView(view==='admin'?'route':'admin');};$('#sourceButton').onclick=()=>switchView('about');
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
async function boot(){if(!READ_ONLY){try{db=await openDB();const saved=await loadDB();if(saved){validateState(saved);state=saved;selectedId=state.nodes[0].id;}}catch(e){toast('本地保存不可用：'+e.message,true);}}render();}
if(typeof window!=='undefined')window.CampCore={initialState,validateState,validatePublication,publishNode,publicState,stats,normalizeGroup,escapeHtml};
boot();
</script>
</body>
